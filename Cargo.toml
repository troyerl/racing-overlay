[workspace]
resolver = "2"
members = [
    "crates/gridglance-ipc",
    "crates/gridglance-overlay",
]
default-members = ["crates/gridglance-overlay"]

[workspace.package]
version = "1.69.27"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# Local `cargo run --release`: optimized but incremental-friendly.
# Installers / CI packaging use `--profile dist` (thin LTO + single CGU).
[profile.release]
opt-level = 3
lto = false
codegen-units = 16

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
