name: Build & Release

# Build a Windows installer, tag the commit, and publish a GitHub Release on
# every push to main / master. feature/rust uses prerelease-rust.yml instead.
# Skip with "[skip ci]" in the commit message.
# Tests live in ci.yml on the same push — do not re-run them here.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msvc
          cache-targets: true

      - name: Read version & notes from RELEASE.md
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' RELEASE.md | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [[ -z "$version" ]]; then
            echo "No '## <version>' section found in RELEASE.md" >&2
            exit 1
          fi
          # Body = lines after the top ## until the next ##
          awk -v ver="$version" '
            BEGIN { p=0 }
            /^## / {
              if (p) exit
              if ($0 ~ "^## " ver) { p=1; next }
            }
            p { print }
          ' RELEASE.md | sed -e 's/[[:space:]]*$//' | awk 'NF{p=1} p' | awk 'NF{last=NR} {a[NR]=$0} END{for(i=1;i<=last;i++) print a[i]}' > RELEASE_NOTES.md
          {
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
          echo "version: $version"
          cat RELEASE_NOTES.md

      - name: Stamp Cargo workspace version
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Replace version under [workspace.package] only.
          awk -v v="$APP_VERSION" '
            BEGIN { in_pkg=0 }
            /^\[workspace\.package\]/ { in_pkg=1; print; next }
            /^\[/ { in_pkg=0 }
            in_pkg && /^version[[:space:]]*=/ {
              print "version = \"" v "\""
              next
            }
            { print }
          ' Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
          grep -A2 '\[workspace\.package\]' Cargo.toml
          echo "Stamped workspace version = $APP_VERSION"

      - name: Build gridglance-overlay (dist)
        env:
          GRIDGLANCE_GITHUB_REPO: ${{ github.repository }}
          # Read-only Atlas URI baked into the binary (installers need no .env).
          # Repo secret; leave unset to ship without cloud track sync.
          GRIDGLANCE_MONGODB_READ_URI: ${{ secrets.GRIDGLANCE_MONGODB_READ_URI }}
        run: cargo build --profile dist -p gridglance-overlay

      - name: Cache Inno Setup
        id: cache-innosetup
        uses: actions/cache@v4
        with:
          path: C:\InnoSetup
          key: innosetup-6.7.3-windows

      - name: Install Inno Setup
        if: steps.cache-innosetup.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing
          Start-Process -Wait -FilePath $setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=C:\InnoSetup"
          )
          if (-not (Test-Path "C:\InnoSetup\ISCC.exe")) {
            throw "ISCC.exe missing after Inno Setup install"
          }

      - name: Build the installer
        shell: pwsh
        run: |
          & "C:\InnoSetup\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "installer\gridglance.iss"

      - name: Publish release (creates the tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: GridGlance ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: installer_output/*.exe
